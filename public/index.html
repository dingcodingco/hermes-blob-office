<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Blob Office</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true"><svg viewBox="-10 -10 220 220" id="logoBot"></svg></span>
      <strong id="title">Blob Office</strong>
      <span id="mode" class="badge">데모</span>
    </div>
    <div class="counts" id="counts"></div>
    <nav class="tabs">
      <span class="pages" id="pages" hidden></span>
      <button data-panel="feed">보고함</button>
      <button data-panel="kanban">칸반</button>
      <button data-panel="skills">스킬·연결</button>
      <button id="meetingBtn" class="primary">회의 열기</button>
    </nav>
  </header>
  <main class="layout">
    <section class="stage-wrap" id="stageWrap">
      <svg class="stage" id="stage" viewBox="0 0 1672 941" preserveAspectRatio="xMidYMid meet"></svg>
    </section>
    <aside class="panel" id="panel"></aside>
  </main>
  <script>globalThis.NO_LAPTOP = true;</script>
  <script src="bots.js"></script>
  <script src="props.js"></script>
  <script src="app.js"></script>
</body>
</html>
